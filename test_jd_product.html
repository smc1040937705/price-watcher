<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>【示例商品】iPhone 15 Pro Max 256GB 原色钛金属 - 京东</title>
    <style>
        body { font-family: "Microsoft Yahei", Arial; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .product-main { display: flex; gap: 30px; margin-top: 30px; }
        .product-img { width: 450px; height: 450px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; border: 1px solid #eee; }
        .product-info { flex: 1; }
        .sku-name { font-size: 20px; font-weight: bold; color: #333; line-height: 1.5; margin-bottom: 20px; }
        .p-price { color: #e4393c; font-size: 28px; font-weight: bold; }
        .p-price::before { content: '¥'; font-size: 18px; }
        .btn { background: #e4393c; color: white; padding: 10px 30px; border: none; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .stock { color: #008800; margin-top: 15px; }
        .spec-list { margin-top: 20px; }
        .spec-item { display: inline-block; border: 1px solid #ddd; padding: 5px 15px; margin-right: 10px; cursor: pointer; }
        .spec-item.active { border-color: #e4393c; color: #e4393c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>京东 - 模拟商品页面</h1>
    </div>
    
    <div class="product-main">
        <div class="product-img">
            <img id="spec-img" src="https://img10.360buyimg.com/n1/jfs/t1/196728/24/25752/129275/64d98b85F0d3e2b32/1d9d06c7d4e5d3d8.jpg" 
                 alt="iPhone 15 Pro Max" style="max-width: 400px; max-height: 400px;">
        </div>
        
        <div class="product-info">
            <div class="sku-name">
                Apple iPhone 15 Pro Max (A3108) 256GB 原色钛金属 支持移动联通电信5G 双卡双待手机
            </div>
            
            <div class="p-price">8999.00</div>
            
            <div class="stock">
                库存状态：有货，立即购买
            </div>
            
            <div class="spec-list">
                <div class="spec-title">颜色：</div>
                <div class="spec-item active">原色钛金属</div>
                <div class="spec-item">黑色钛金属</div>
                <div class="spec-item">白色钛金属</div>
                <div class="spec-item">蓝色钛金属</div>
            </div>
            
            <div class="spec-list" style="margin-top: 15px;">
                <div class="spec-title">存储容量：</div>
                <div class="spec-item">128GB</div>
                <div class="spec-item active">256GB</div>
                <div class="spec-item">512GB</div>
                <div class="spec-item">1TB</div>
            </div>
            
            <button class="btn">加入购物车</button>
            <button class="btn" style="background: #333; margin-left: 10px;">立即购买</button>
        </div>
    </div>
    
    <div class="product-detail" style="margin-top: 50px; padding-top: 30px; border-top: 1px solid #eee;">
        <h3>商品详情</h3>
        <p>品牌：Apple</p>
        <p>商品名称：AppleiPhone 15 Pro Max</p>
        <p>商品编号：100065243343</p>
        <p>商品毛重：0.52kg</p>
        <p>商品产地：中国大陆</p>
    </div>
</body>
</html>
